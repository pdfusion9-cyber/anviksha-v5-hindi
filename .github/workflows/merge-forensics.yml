name: merge-forensics

# Why does the merged model route to 26% of its experts when a single copy
# routes to 69%? The router-row bug is fixed and the gap remains, so the cause is
# something else in the merge. This measures it on the real checkpoints.
#
# Read only. Nothing is modified, nothing is retrained.

on:
  workflow_dispatch:
    inputs:
      run0: {description: "copy 0 run id", required: true, default: "42342104197"}
      run1: {description: "copy 1 run id", required: true, default: "42342106834"}
      run2: {description: "copy 2 run id", required: true, default: "42342110098"}
      run3: {description: "copy 3 run id", required: true, default: "42342112870"}
      run4: {description: "copy 4 run id", required: true, default: "42342116426"}
      merged: {description: "merged-1b run id", required: true, default: "42375849085"}

permissions:
  actions: read
  contents: read

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet numpy

      - name: Fetch merged
        uses: actions/download-artifact@v4
        with:
          pattern: merged-1b
          path: data/merged
          run-id: ${{ inputs.merged }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 0
        uses: actions/download-artifact@v4
        with:
          pattern: segment-0-*
          path: data/c0
          run-id: ${{ inputs.run0 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 1
        uses: actions/download-artifact@v4
        with:
          pattern: segment-1-*
          path: data/c1
          run-id: ${{ inputs.run1 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 2
        uses: actions/download-artifact@v4
        with:
          pattern: segment-2-*
          path: data/c2
          run-id: ${{ inputs.run2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 3
        uses: actions/download-artifact@v4
        with:
          pattern: segment-3-*
          path: data/c3
          run-id: ${{ inputs.run3 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 4
        uses: actions/download-artifact@v4
        with:
          pattern: segment-4-*
          path: data/c4
          run-id: ${{ inputs.run4 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: List what arrived
        run: |
          find data -name "*.pt" | sort
          echo "checkpoints: $(find data -name '*.pt' | wc -l)"

      - name: Run the forensics
        run: |
          set -eu
          M=$(find data/merged -name merged.pt | head -1)
          C0=$(find data/c0 -name chat.pt | head -1)
          C1=$(find data/c1 -name chat.pt | head -1)
          C2=$(find data/c2 -name chat.pt | head -1)
          C3=$(find data/c3 -name chat.pt | head -1)
          C4=$(find data/c4 -name chat.pt | head -1)
          python src/merge_forensics.py "$M" "$C0" "$C1" "$C2" "$C3" "$C4"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-forensics
          path: merge_forensics.json
          if-no-files-found: warn
