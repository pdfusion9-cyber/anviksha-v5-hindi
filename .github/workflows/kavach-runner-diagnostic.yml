name: kavach-runner-diagnostic

# Disabled: superseded by .github/workflows/kavach-unified.yml (single-run orchestration).
on: {}

permissions:
  contents: read

jobs:
  runner-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove hosted runner started
        shell: bash
        run: |
          set -euxo pipefail
          echo "KAVACH_RUNNER_DIAGNOSTIC=STARTED"
          echo "PUBLIC_REPOSITORY_RECHECK=20261106"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_NAME=$RUNNER_NAME"
          id
          uname -a
          python --version
          git --version
          echo "KAVACH_RUNNER_DIAGNOSTIC=PASS"
          echo "KAVACH_RUNNER_DIAGNOSTIC=END"
