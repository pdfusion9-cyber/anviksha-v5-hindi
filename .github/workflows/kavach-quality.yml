name: kavach-quality-gates

on:
  push:
    branches:
      - anviksha-safe-merge-20261106
    paths:
      - "src/kavach.py"
      - "src/kavach_model1.py"
      - "src/moe_sft.py"
      - "src/bpe_tokenizer.py"
      - "src/evaluate_kavach_model1.py"
      - "src/security_agent.py"
      - "src/capability_policy.py"
      - "src/kavach_sandbox.py"
      - "src/pii_india.py"
      - "tests/test_kavach_policy.py"
      - "tests/test_kavach_model1.py"
      - "tests/test_moe_sft.py"
      - "tests/test_model1_output_quality.py"
      - "src/test_security_agent.py"
      - ".github/workflows/kavach-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-kavach-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anviksha-safe-merge-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile KAVACH modules
        run: |
          python -m py_compile src/kavach.py src/kavach_model1.py src/moe_sft.py src/bpe_tokenizer.py src/evaluate_kavach_model1.py src/security_agent.py src/capability_policy.py src/kavach_sandbox.py src/pii_india.py
      - name: Run bilingual policy and adversarial regression tests
        run: |
          pytest -q tests/test_kavach_policy.py tests/test_kavach_model1.py tests/test_moe_sft.py tests/test_model1_output_quality.py src/test_security_agent.py
