name: merge-five

# Fold the five finished copies into one model, without retraining.
#
# The five-copy run trained all five successfully and then failed at the merge,
# for a reason worth keeping: the check refused to combine an accumulator that
# already held 24 experts with a copy that held 12, because their router shapes
# differ. That difference is exactly what a merge produces, so folding several
# in one at a time could never have worked. The check now allows a router that
# differs by the expert count, and this workflow exists so the five checkpoints
# that already exist do not have to be trained again to prove it.

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "the moe-five run whose artifacts to fold"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Bring the five copies down
        uses: actions/download-artifact@v4
        with:
          pattern: copy-*
          path: copies
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Bring the shared tokenizer down
        uses: actions/download-artifact@v4
        with:
          name: five-shared
          path: sharedroot
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Show what arrived
        run: |
          find copies sharedroot -maxdepth 3 -type f | head -20
          echo "checkpoints: $(find copies -name chat.pt | wc -l)"

      - name: Fold them into one
        run: |
          set -eu
          FOUND=$(find copies -name chat.pt | sort)
          COUNT=$(printf "%s\n" "$FOUND" | grep -c . || true)
          echo "checkpoints found: $COUNT"
          printf "%s\n" "$FOUND"
          [ "$COUNT" -ge 2 ] || { echo "a transfer needs at least two"; exit 1; }

          # the tokenizer: take it from the shared bundle if present, else from
          # any copy, and never copy a file onto itself
          TOK=$(find sharedroot copies -name tokenizer.json 2>/dev/null | head -1)
          echo "tokenizer: $TOK"
          [ -n "$TOK" ] || { echo "no tokenizer; embedding rows would not line up"; exit 1; }

          mkdir -p work out
          BASE=$(printf "%s\n" "$FOUND" | head -1)
          cp "$BASE" work/acc.pt
          cp "$TOK" work/tok.json

          for NEXT in $(printf "%s\n" "$FOUND" | tail -n +2); do
            echo "=== folding $(dirname "$NEXT") ==="
            python src/merge_experts.py --base work/acc.pt --incoming "$NEXT" \
              --out work/next.pt --threshold 0.999 --average-shared
            mv work/next.pt work/acc.pt
          done

          cp work/acc.pt out/hindi_five.pt
          cp work/tok.json out/tokenizer.json
          python - <<'PY'
          import json, sys, torch
          sys.path.insert(0, "src")
          from pathlib import Path
          from moe_model import MoEConfig
          st = torch.load("out/hindi_five.pt", weights_only=False)
          cfg = MoEConfig(**st["config"])
          c = cfg.counts()
          print(f"\nMERGED: {c['total']:,} parameters, {c['active']:,} active")
          print(f"experts: {cfg.experts}")
          Path("out/summary.json").write_text(json.dumps(
              {"config": cfg.__dict__, **c}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hindi-five-folded
          path: out/
          if-no-files-found: warn
