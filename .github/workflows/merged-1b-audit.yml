name: merged-1b-isolated-audit

on:
  push:
    branches:
      - experiment/merged-1b-audit-20261107
    paths:
      - .github/workflows/merged-1b-audit.yml
      - tools/merged_1b_audit.py
      - tools/merge_1b_repaired.py
      - src/moe_model.py

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --no-cache-dir --quiet numpy
          python -m pip install --no-cache-dir --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download source checkpoint 0
        uses: actions/download-artifact@v4
        with:
          name: segment-0-42275510662
          path: copies/segment-0-42275510662
          run-id: 42275510662
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download source checkpoint 1
        uses: actions/download-artifact@v4
        with:
          name: segment-1-42273920152
          path: copies/segment-1-42273920152
          run-id: 42273920152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download source checkpoint 2
        uses: actions/download-artifact@v4
        with:
          name: segment-2-42271805121
          path: copies/segment-2-42271805121
          run-id: 42271805121
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download source checkpoint 3
        uses: actions/download-artifact@v4
        with:
          name: segment-3-42267619625
          path: copies/segment-3-42267619625
          run-id: 42267619625
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download source checkpoint 4
        uses: actions/download-artifact@v4
        with:
          name: segment-4-42272958418
          path: copies/segment-4-42272958418
          run-id: 42272958418
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Build repaired five-way merge with original routers
        run: |
          set -eu
          python tools/merge_1b_repaired.py
          test -s repaired/merged.pt
          test -s repaired/tokenizer.json
          test -s repaired/summary.json
      - name: Audit repaired checkpoint, all-expert coverage and generations
        run: |
          set -eu
          mkdir -p artifact
          cp repaired/merged.pt repaired/tokenizer.json repaired/summary.json artifact/
          python tools/merged_1b_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-merged-1b-audit
          path: |
            repaired/
            audit/merged_1b_audit.json
          if-no-files-found: warn
