name: merge-now

# Fold the five trained copies into one model and publish it as an artifact.
#
# 5 x 215,593,728 parameters, twenty-two experts each, merge to 110 experts and
# just over a billion parameters with active parameters unchanged, so inference
# costs the same.
#
# The first version downloaded the artifacts with urllib and failed: the archive
# URL redirects to blob storage and the Authorization header does not survive the
# redirect. The action handles that, so each copy is fetched with it and the run
# ids come from a step output rather than being typed in.

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "cosine above which an incoming expert counts as a duplicate"
        required: true
        default: "0.999"

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Find the newest checkpoint for each of the five copies
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {tok}",
                  "Accept": "application/vnd.github+json"})
              return json.loads(urllib.request.urlopen(req).read())
          best = {}
          for page in (1, 2, 3, 4):
              runs = api(f"https://api.github.com/repos/{repo}/actions/runs"
                         f"?per_page=100&page={page}")["workflow_runs"]
              if not runs:
                  break
              for r in runs:
                  if r.get("conclusion") != "success":
                      continue
                  if r["name"] not in ("long-train", "vocab-then-train"):
                      continue
                  for a in api(r["artifacts_url"])["artifacts"]:
                      n = a["name"]
                      if n.startswith("segment-"):
                          c = n.split("-")[1]
                          if c not in best:
                              best[c] = r["id"]
          if len(best) != 5:
              raise SystemExit(f"found {len(best)} copies, need five: {sorted(best)}")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              for c, rid in best.items():
                  f.write(f"run{c}={rid}\n")
                  print(f"copy {c}: run {rid}")
          PY

      - name: Fetch copy 0
        uses: actions/download-artifact@v4
        with:
          pattern: segment-0-*
          path: copies/0
          run-id: ${{ steps.find.outputs.run0 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 1
        uses: actions/download-artifact@v4
        with:
          pattern: segment-1-*
          path: copies/1
          run-id: ${{ steps.find.outputs.run1 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 2
        uses: actions/download-artifact@v4
        with:
          pattern: segment-2-*
          path: copies/2
          run-id: ${{ steps.find.outputs.run2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 3
        uses: actions/download-artifact@v4
        with:
          pattern: segment-3-*
          path: copies/3
          run-id: ${{ steps.find.outputs.run3 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Fetch copy 4
        uses: actions/download-artifact@v4
        with:
          pattern: segment-4-*
          path: copies/4
          run-id: ${{ steps.find.outputs.run4 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Show what arrived
        run: |
          find copies -name chat.pt | sort
          echo "checkpoints: $(find copies -name chat.pt | wc -l)"

      - name: Fold them into one model
        run: |
          set -eu
          mkdir -p work out
          FIRST=$(find copies/0 -name chat.pt | head -1)
          test -f "$FIRST" || { echo "copy 0 has no checkpoint"; exit 1; }
          cp "$FIRST" work/acc.pt
          TOK=$(find copies -name tokenizer.json | head -1 || true)
          [ -n "$TOK" ] && cp "$TOK" work/tok.json || true
          for C in 1 2 3 4; do
            NEXT=$(find "copies/$C" -name chat.pt | head -1)
            test -f "$NEXT" || { echo "copy $C has no checkpoint"; exit 1; }
            echo "=== folding copy $C ==="
            python src/merge_experts.py \
              --base work/acc.pt --incoming "$NEXT" \
              --out work/next.pt \
              --threshold ${{ inputs.threshold }} --average-shared
            mv work/next.pt work/acc.pt
          done
          cp work/acc.pt out/merged.pt
          [ -f work/tok.json ] && cp work/tok.json out/tokenizer.json || true
          python - <<'PY'
          import json, sys, torch
          sys.path.insert(0, "src")
          from pathlib import Path
          from moe_model import MoEConfig
          st = torch.load("out/merged.pt", weights_only=False)
          cfg = MoEConfig(**st["config"])
          c = cfg.counts()
          print(f"MERGED {c['total']:,} parameters, {c['active']:,} active")
          print(f"experts {cfg.experts}")
          Path("out/summary.json").write_text(json.dumps(
              {"config": cfg.__dict__, **c}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-1b
          path: out/
          if-no-files-found: warn
