name: hplt-sample

# Stage 1 of the corpus plan: look before downloading.
#
# The Hindi corpus is 59.97 GB across 17 shards. This takes a bounded sample
# from the best and the worst WDS quality bin and measures what is actually in
# there, so the decision about how much to take is made on evidence.
#
# It runs here rather than in the sandbox because data.hplt-project.org is not
# reachable from there; a runner has open internet.

on:
  workflow_dispatch:
    inputs:
      max_bytes:
        description: "decompressed bytes per shard"
        required: true
        default: "120000000"
      max_docs:
        description: "documents per shard"
        required: true
        default: "60000"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install zstandard

      - name: Check the host is reachable from a runner
        run: |
          curl -sSI https://data.hplt-project.org/three/sorted/hin_Deva.map | head -5

      - name: Sample and measure
        run: |
          python src/hplt_sample.py \
            --max-bytes ${{ inputs.max_bytes }} \
            --max-docs ${{ inputs.max_docs }} \
            --out runs/hplt_sample.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hplt-sample
          path: runs/hplt_sample.json
          if-no-files-found: warn
