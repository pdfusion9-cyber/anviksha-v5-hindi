name: e2e-test

# How many questions come back correct, and does anything wrong ever escape?
#
# Two separate questions, because they mean different things:
#
#   known   a question the knowledge base contains. The stored answer is the
#           right answer, so the pipeline should return it. This is the
#           "correct by construction" claim and it is measurable.
#
#   unseen  a question the base does not contain. The pipeline should refuse
#           rather than return a lookalike. Any wrong answer here is a failure.
#
# The run fails if a single wrong answer is returned, because a wrong answer
# arriving with the confidence of a stored fact is worse than a refusal.

on:
  workflow_dispatch:
    inputs:
      limit:
        required: true
        default: "500"
      threshold:
        required: true
        default: "0.62"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyarrow requests
          # the reasoning fallback runs the model, so torch has to be here; the
          # CPU wheel keeps this from pulling a multi-gigabyte CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build the full corpus
        run: |
          python src/fetch_multi.py --max-prompt 140 --max-reply 260 --cap 40000 --heldout 1000
          python src/fetch_extra.py --max-prompt 140 --max-reply 260 --cap 40000
          python src/merge_corpus.py --heldout 1000
          cat data/corpus_stats.json
          wc -l data/multi_train.jsonl data/multi_heldout.jsonl

      - name: Train BPE-4096 and measure what fits in a 256-token context
        run: |
          python src/train_bpe.py \
            --corpus data/multi_train.jsonl \
            --vocab 4096 \
            --out runs/bpe4096.json \
            --report runs/bpe_report.json
          cat runs/bpe_report.json

      - name: Download the trained checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v5-hindi-run
          path: runs/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41565319306
        continue-on-error: true

      - name: Locate the checkpoint
        id: ckpt
        run: |
          found=$(find runs -name "chat.pt" | head -1)
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "checkpoint: ${found:-none}"
          ls -la runs/ | head -20

      - name: "Reasoning fallback: model answers, judge gates it"
        if: steps.ckpt.outputs.path != ''
        run: |
          python src/e2e_test.py \
            --model "${{ steps.ckpt.outputs.path }}" \
            --kb data/multi_train.jsonl \
            --test data/multi_heldout.jsonl \
            --limit ${{ inputs.limit }} \
            --threshold 0.92 \
            --out runs/e2e_reasoning.json

      - name: "What the model answers, by kind of question"
        run: |
          python src/show_answers.py \
            --kb data/multi_train.jsonl \
            --test data/multi_heldout.jsonl \
            --limit ${{ inputs.limit }} \
            --threshold 0.92

      - name: "Modern retrieval: BM25 + rerank"
        run: |
          python src/bm25_retrieval.py data/multi_train.jsonl data/multi_heldout.jsonl ${{ inputs.limit }}

      - name: "Method and result store: reuse, adaptation, staleness"
        run: python src/method_store.py

      - name: "End-to-end (recognition memory: familiarity + recollection)"
        run: |
          python src/e2e_test.py \
            --brain \
            --kb data/multi_train.jsonl \
            --test data/multi_heldout.jsonl \
            --limit ${{ inputs.limit }} \
            --out runs/e2e_brain.json

      - name: End-to-end (similarity threshold, for comparison)
        run: |
          python src/e2e_test.py \
            --kb data/multi_train.jsonl \
            --test data/multi_heldout.jsonl \
            --limit ${{ inputs.limit }} \
            --threshold ${{ inputs.threshold }} \
            --sweep 0.62,0.70,0.78,0.85,0.92 \
            --out runs/e2e.json

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            runs/e2e.json
            runs/e2e_brain.json
            runs/answers_by_kind.json
            runs/e2e_reasoning.json
            runs/e2e_sweep.json
            runs/bpe4096.json
            runs/bpe_report.json
            data/corpus_stats.json
