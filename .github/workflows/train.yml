name: train-hindi-chat

on:
  workflow_dispatch:
    inputs:
      target_steps:
        description: "step ceiling (0 = let the clock budget decide)"
        required: true
        default: "0"
      clock_budget_minutes:
        description: "wall-clock budget in minutes, bound to the measured CPU clock"
        required: true
        default: "315"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch Hindi instruction data
        run: python src/fetch_chat.py --target 0 --held-out 400

      - name: Report CPU clock
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from clock import make_budget
          b = make_budget(60)
          print(f"clock {b.clock_ghz:.3f} GHz via {b.clock_source}")
          PY

      - name: Fetch Hindi text for pretraining
        run: python src/fetch_text.py --out hindi_corpus.txt --chars 2000000

      - name: Pretrain on Hindi text
        run: |
          python src/train.py --stage pretrain --text hindi_corpus.txt \
            --dim 640 --layers 8 --ffn 2560 \
            --seq-len 128 --batch 8 --steps 200 --time-budget 900 || true

      - name: Chat fine-tune, clock-bound
        run: |
          python src/train.py --stage chat --dim 640 --layers 8 --ffn 2560 \
            --seq-len 128 --batch 8 --lr 3e-4 \
            --target-steps ${{ inputs.target_steps }} \
            --clock-budget-minutes ${{ inputs.clock_budget_minutes }}

      - name: Held-out evaluation and safety screen
        run: python src/eval_chat.py --limit 200 --generate 30 || true

      - name: Quantize to int8 and int4
        run: python src/quantize.py --limit 100 || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: v5-hindi-run
          path: |
            runs/chat.pt
            runs/eval.json
            runs/clock_report.json
            runs/quantization.json
            runs/tokenizer.json
          retention-days: 30
