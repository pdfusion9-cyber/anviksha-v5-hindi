name: train-hindi-chat

on:
  workflow_dispatch:
    inputs:
      target_steps:
        description: "step ceiling (0 = let the clock budget decide)"
        required: true
        default: "0"
      clock_budget_minutes:
        description: "chat wall-clock budget in minutes"
        required: true
        default: "45"
      dim:
        description: "model width"
        required: true
        default: "384"
      layers:
        description: "model depth"
        required: true
        default: "6"
      heads:
        description: "attention heads"
        required: true
        default: "6"
      ffn:
        description: "feed-forward width"
        required: true
        default: "1536"
      pretrain_minutes:
        description: "pretraining wall-clock budget in minutes (0 = skip)"
        required: true
        default: "55"
      distinct_blocks:
        description: "1 = one block per layer (best loss, about 9% slower)"
        required: true
        default: "1"
      drift:
        description: "shared waves giving each layer a free gain; 0 disables"
        required: true
        default: "8"
      seq_len:
        description: "context length; pairs are filtered to fit it"
        required: true
        default: "128"
      pretrain_chars:
        description: "characters of Hindi text to use"
        required: true
        default: "2500000"
      share_blocks:
        description: "1 = ALBERT-style weight sharing, 0 = distinct blocks"
        required: true
        default: "1"
      brain_mechanisms:
        description: "1 = multi-level + sparsity + criticality + hippocampus"
        required: true
        default: "1"
      resume_run_id:
        description: "optional: download this run's artifact into runs/ first, to continue training"
        required: false
        default: ""

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Long training is split across jobs: this pulls the previous checkpoint
      # back in so a 16-hour pretrain can be built from 6-hour pieces.
      - name: Resume from a previous run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: v5-hindi-run
          path: runs
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch Hindi instruction data
        run: python src/fetch_multi.py

      # Measured on these runners: threads 2 gave 0.42 s/step, threads 4 gave
      # 2.39 s/step for identical work -- 5.7x slower. The 4 vCPU are shared and
      # oversubscribed, so asking PyTorch for 4 threads thrashes.
      - name: Report CPU clock
        run: |
          python - <<'PY'
          import os, sys; sys.path.insert(0, "src")
          from clock import make_budget
          b = make_budget(60)
          print(f"clock {b.clock_ghz:.3f} GHz via {b.clock_source}")
          print(f"cpu count {os.cpu_count()}")
          PY

      - name: Fetch Hindi text for pretraining
        run: python src/fetch_text.py --out hindi_corpus.txt --chars ${{ inputs.pretrain_chars }} --min-chars 100000

      - name: Add the large Hindi sources (toward 100k pairs)
        run: |
          python src/fetch_extra.py --max-prompt 140 --max-reply 260 --cap 40000
          python src/merge_corpus.py --heldout 1000
          cat data/corpus_stats.json

      - name: Build the reasoning corpus (every reply thinks first)
        run: |
          python src/build_reasoning.py --compact \
            --train data/multi_train.jsonl \
            --heldout data/multi_heldout.jsonl \
            --out-train data/reason_train.jsonl \
            --out-heldout data/reason_heldout.jsonl

      - name: Pretrain on Hindi text
        if: ${{ inputs.pretrain_minutes != '0' }}
        run: |
          python src/train.py --stage pretrain --text hindi_corpus.txt \
            --text-chars ${{ inputs.pretrain_chars }} \
            --dim ${{ inputs.dim }} --layers ${{ inputs.layers }} \
            --heads ${{ inputs.heads }} --ffn ${{ inputs.ffn }} \
            --seq-len ${{ inputs.seq_len }} --batch 8 --steps 1000000 --threads 2 \
            --checkpoint-every 500 \
            --time-budget $(( ${{ inputs.pretrain_minutes }} * 60 )) \
            ${{ inputs.distinct_blocks == '1' && '--distinct-blocks' || (inputs.share_blocks == '1' && '--share-blocks' || '') }} \
            --drift ${{ inputs.drift }} \
            ${{ inputs.brain_mechanisms == '1' && '--multi-level --sparsity 0.01 --criticality' || '' }}

      - name: Chat fine-tune, clock-bound
        run: |
          python src/train.py --stage chat \
            --dim ${{ inputs.dim }} --layers ${{ inputs.layers }} \
            --heads ${{ inputs.heads }} --ffn ${{ inputs.ffn }} \
            --seq-len ${{ inputs.seq_len }} --batch 8 --lr 3e-4 --threads 2 \
            --checkpoint-every 200 \
            --chat data/reason_train.jsonl \
            --target-steps ${{ inputs.target_steps }} \
            --clock-budget-minutes ${{ inputs.clock_budget_minutes }} \
            ${{ inputs.distinct_blocks == '1' && '--distinct-blocks' || (inputs.share_blocks == '1' && '--share-blocks' || '') }} \
            --drift ${{ inputs.drift }} \
            ${{ inputs.brain_mechanisms == '1' && '--multi-level --sparsity 0.01 --criticality --hippocampus --reward-weighting' || '--reward-weighting' }}

      - name: Held-out evaluation and safety screen
        run: python src/eval_chat.py --heldout data/reason_heldout.jsonl --limit 200 --generate 30 || true

      - name: Evaluate on an unseen source (hh-rlhf, never trained on)
        run: python src/eval_unseen.py --parquet data/unseen_hh.jsonl --limit 200 || true

      - name: Strict judge -- can it answer correctly, and does it think first
        run: |
          python src/eval_path.py --checkpoint runs/chat.pt \
            --prompts data/reason_heldout.jsonl \
            --out runs/path_eval.json --limit 150 --max-new 320 || true

      - name: Quantize to int8 and int4
        run: python src/quantize.py --limit 100 || true

      - name: Check evaluation produced numbers
        if: always()
        run: |
          missing=""
          for f in runs/eval.json runs/unseen_eval.json runs/quantization.json runs/eta.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::evaluation produced no output for:$missing"
            echo "The steps above use '|| true' so their errors are not fatal, but a"
            echo "missing file means a script crashed. Check the log for the traceback."
            exit 1
          fi
          echo "all expected result files present"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-hindi-run
          path: |
            runs/chat.pt
            runs/pretrain.pt
            runs/eval.json
            runs/clock_report.json
            runs/quantization.json
            runs/unseen_eval.json
            runs/tokenizer.json
            runs/eta.json
            runs/brain_report.json
            runs/criticality.json
          retention-days: 30
