name: kavach-model1-sft-smoke

# Test the immutable SFT candidate through the exact guarded Model 1 adapter.
# The base artifact supplies the matching tokenizer; no checkpoint is replaced.
on:
  push:
    branches:
      - anviksha-safe-merge-20261106
    paths:
      - ".github/workflows/kavach-model1-sft-smoke.yml"
      - "src/evaluate_kavach_model1.py"
      - "src/kavach_model1.py"
      - "src/int4_checkpoint.py"
  workflow_dispatch:
    inputs:
      sft_run_id:
        description: "Successful SFT run containing kavach-model1-chat-sft-candidate"
        required: true
        default: "42243800814"
      base_run_id:
        description: "Successful merge-five run containing matching base tokenizer"
        required: true
        default: "42233090777"
      max_new_tokens:
        description: "Maximum generation tokens per prompt"
        required: true
        default: "48"

permissions:
  actions: read
  contents: read

jobs:
  candidate-inference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anviksha-safe-merge-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download matching base tokenizer
        uses: actions/download-artifact@v4
        with:
          name: hindi-five-folded
          path: base
          run-id: ${{ github.event.inputs.base_run_id || '42233090777' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download isolated SFT candidate
        uses: actions/download-artifact@v4
        with:
          name: kavach-model1-chat-sft-candidate
          path: candidate
          run-id: ${{ github.event.inputs.sft_run_id || '42243800814' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Verify candidate and tokenizer files
        run: |
          find base candidate -maxdepth 4 -type f -printf '%p %s bytes\n'
          test -s base/tokenizer.json
          test -s candidate/runs/kavach_model1_chat_sft.pt
          test -s candidate/runs/kavach_model1_chat_sft.json
          sha256sum base/tokenizer.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("candidate/runs/kavach_model1_chat_sft.json").read_text())
          assert report["source_checkpoint_preserved"] is True
          assert report["answer_only_loss"] is True
          assert report["parameters"] == 574391040
          before=report["heldout_answer_loss_before"]["mean_answer_loss"]
          after=report["heldout_answer_loss_after"]["mean_answer_loss"]
          assert before is not None and after is not None and after < before
          print(f"SFT report validated; held-out answer loss {before:.6f} -> {after:.6f}")
          PY
      - name: Quantize full SFT candidate to packed INT4
        run: |
          python src/int4_checkpoint.py quantize \
            --input candidate/runs/kavach_model1_chat_sft.pt \
            --output runs/kavach_model1_chat_sft.int4.pt \
            --tokenizer base/tokenizer.json --group-size 128
          python src/int4_checkpoint.py verify \
            --input runs/kavach_model1_chat_sft.int4.pt \
            | tee runs/kavach_model1_int4_verify.json
          test -s runs/kavach_model1_chat_sft.int4.pt
      - name: Upload packed INT4 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: kavach-model1-chat-sft-int4
          path: |
            runs/kavach_model1_chat_sft.int4.pt
            runs/kavach_model1_int4_verify.json
          if-no-files-found: error
      - name: Run six guarded prompts against SFT candidate
        run: |
          python src/evaluate_kavach_model1.py \
            --checkpoint candidate/runs/kavach_model1_chat_sft.pt \
            --tokenizer base/tokenizer.json \
            --max-new-tokens "${{ github.event.inputs.max_new_tokens || '48' }}" \
            --out runs/kavach_model1_sft_smoke.json
      - name: Upload candidate smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavach-model1-sft-smoke-report
          path: |
            runs/kavach_model1_sft_smoke.json
            runs/kavach_model1_audit/
          if-no-files-found: warn
