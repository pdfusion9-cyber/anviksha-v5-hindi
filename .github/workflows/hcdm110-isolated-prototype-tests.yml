name: hcdm110-isolated-prototype-tests

on:
  push:
    branches:
      - experiment/hcdm110-isolated-prototype-20261107
    paths:
      - research/hcdm110/**
      - .github/workflows/hcdm110-isolated-prototype-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --no-cache-dir --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm isolation contract
        run: |
          set -eu
          ! grep -R -nE 'from (src\.moe_model|moe_model|src\.stream_train)|import (moe_model|stream_train)' research/hcdm110
          ! grep -R -nE 'torch\.load|torch\.save|load_state_dict' research/hcdm110
          python -m py_compile research/hcdm110/hcdm110_prototype.py research/hcdm110/test_hcdm110_prototype.py
      - name: Run HCDM synthetic component tests
        run: |
          python research/hcdm110/test_hcdm110_prototype.py
      - name: Report exact adapter and memory footprint
        run: |
          python - <<'PY'
          import sys, json, torch
          sys.path.insert(0, "research/hcdm110")
          from hcdm110_prototype import HCDM110Prototype, AssociativeMemory
          m=HCDM110Prototype()
          p=m.parameter_report()
          # CPU float32 lower bound for 10,000 4096-dim keys + 384-dim values.
          memory_bytes=10000*(4096+384)*4
          print(json.dumps({
            "prototype_trainable_parameters":p["trainable_parameters"],
            "adapter_parameters":p["adapter_parameters"],
            "frozen_dg_projection_elements":p["dg_frozen_buffer_elements"],
            "memory_10k_entries_float32_bytes":memory_bytes,
            "memory_10k_entries_MiB":round(memory_bytes/2**20,2),
            "production_checkpoint_loaded":False,
            "production_model_modified":False
          },indent=2))
          PY

      - name: Run 1,000-example DG and CA3 benchmark
        run: |
          python research/hcdm110/benchmark_ca3_dg.py --out reports/hcdm110_ca3_dg_benchmark.json
      - name: Validate benchmark reproducibility and metrics
        run: |
          python research/hcdm110/test_benchmark_ca3_dg.py
      - name: Run harder multi-seed independent-cue DG and CA3 benchmark
        run: |
          python research/hcdm110/benchmark_hard_dg_ca3.py --out reports/hcdm110_hard_dg_ca3.json
      - name: Validate harder retrieval benchmark
        run: |
          python research/hcdm110/test_hard_dg_ca3.py
      - name: Run supervised learnable DG retrieval comparison
        run: |
          python research/hcdm110/benchmark_learnable_dg.py --out reports/hcdm110_learnable_dg.json
      - name: Validate learnable DG comparison
        run: |
          python research/hcdm110/test_learnable_dg.py
      - name: Run supervised contrastive DG top-k and validation-tuned hybrid benchmark
        run: |
          python research/hcdm110/benchmark_contrastive_dg.py --out reports/hcdm110_contrastive_dg.json
      - name: Validate contrastive DG benchmark
        run: |
          python research/hcdm110/test_contrastive_dg.py
      - name: Run large independent-query paired evaluation
        run: |
          python research/hcdm110/benchmark_large_query_eval.py --out reports/hcdm110_large_query_eval.json
      - name: Validate large-query paired evaluation
        run: |
          python research/hcdm110/test_large_query_eval.py
      - name: Run licensed real-language retrieval benchmark
        run: |
          python research/hcdm110/benchmark_real_language_retrieval.py --out reports/hcdm110_realtext.json
      - name: Validate real-language dataset pipeline
        run: |
          python research/hcdm110/test_real_language_retrieval.py
