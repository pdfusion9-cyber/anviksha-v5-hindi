name: merged-1b-generation-diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/merged-1b-audit-20261107
    paths:
      - .github/workflows/merged-1b-generation-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download successful repaired model artifact
        uses: actions/download-artifact@v4
        with:
          name: repaired-merged-1b-model
          run-id: 42352023153
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Inspect raw EOS ranking and forced non-special continuations
        run: python tools/merged_1b_generation_diagnostic.py
      - name: Upload small generation diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-110-expert-generation-diagnostic
          path: diagnostic/generation_diagnostic.json
          if-no-files-found: warn
